name: CMake Tests

on:
  workflow_call:
    inputs:
      os:
        description: "GitHub Actions runner OS (e.g. ubuntu-24.04, macos-latest, windows-2022)"
        required: true
        type: string
      container_image:
        description: "Docker container image to run in (empty string for host execution)"
        required: false
        default: ""
        type: string
      compiler:
        description: "Compiler toolchain to use on Linux (gcc or clang)"
        required: false
        default: "gcc"
        type: string
    secrets:
      GAR_SERVICE_ACCOUNT:
        description: "Google Cloud service account key JSON for Artifact Registry, RBE, and sccache"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    name: Test
    container:
      image: ${{ inputs.container_image }}
      # core=1 skips kernel pipe core_pattern handlers (e.g. apport) on death tests.
      options: --ulimit core=1
      credentials:
        # TODO(b/582433361): Switch to Workload Identity Federation to avoid the need for secrets.
        username: _json_key
        password: ${{ secrets.GAR_SERVICE_ACCOUNT }}
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ startsWith(inputs.os, 'ubuntu') && (inputs.compiler == 'clang' && '/opt/llvm/bin/clang' || 'gcc') || '' }}
      CFLAGS: ${{ startsWith(inputs.os, 'ubuntu') && (inputs.compiler == 'clang' && '-Werror --gcc-toolchain=/usr/local' || '-Werror') || '' }}
      CXX: ${{ startsWith(inputs.os, 'ubuntu') && (inputs.compiler == 'clang' && '/opt/llvm/bin/clang++' || 'g++') || '' }}
      CXXFLAGS: ${{ startsWith(inputs.os, 'ubuntu') && (inputs.compiler == 'clang' && '-Werror -Wdeprecated --gcc-toolchain=/usr/local' || '-Werror -Wdeprecated') || (startsWith(inputs.os, 'windows') && '-WX' || '') }}
      LDFLAGS: ${{ startsWith(inputs.os, 'ubuntu') && inputs.compiler == 'clang' && '-Wl,-rpath,/usr/local/lib64' || '' }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ startsWith(inputs.os, 'ubuntu') && 50 || 16 }}
      CMAKE_C_COMPILER_LAUNCHER: ${{ startsWith(inputs.os, 'ubuntu') && 'rewrapper' || 'sccache' }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ startsWith(inputs.os, 'ubuntu') && 'rewrapper' || 'sccache' }}
      CMAKE_GENERATOR: Ninja
      CTEST_OUTPUT_ON_FAILURE: 1
      CTEST_PARALLEL_LEVEL: 16
      RBE_service: us-east1-remotebuildexecution.googleapis.com:443
      RBE_instance: projects/google.com:absl-177019/instances/absl-ci-east
      RBE_use_application_default_credentials: true
      RBE_exec_strategy: remote
      RBE_exec_root: ${{ github.workspace }}
      RBE_platform: OSArch=amd64,cache-silo-key=n2-highcpu-2-2026-10-14,container-image=docker://${{ inputs.container_image }},dockerRunAsRoot=true
      SCCACHE_GCS_BUCKET: gtest-cmake-sccache
      SCCACHE_GCS_RW_MODE: READ_WRITE
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: "2022"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GAR_SERVICE_ACCOUNT }}

      - name: Set up sccache
        if: ${{ runner.os != 'Linux' }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Start sccache
        if: ${{ runner.os != 'Linux' }}
        env:
          SCCACHE_GCS_KEY_PATH: ${{ steps.auth.outputs.credentials_file_path }}
        run: sccache --start-server

      - name: Start reclient (RBE)
        if: ${{ runner.os == 'Linux' }}
        run: |
          # CMake passes absolute source/include paths (${GITHUB_WORKSPACE}/...) to
          # the compiler, so mount the remote input root at that same container path.
          echo "RBE_platform=${RBE_platform},InputRootAbsolutePath=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          bootstrap

      - name: Configure
        env:
          DEBUG_FLAGS: ${{ runner.os == 'Windows' && '-O1 -Ob1 -Zc:inline' || '-g' }}
        run: >
          cmake -B build
          -Dgtest_build_samples=ON
          -Dgtest_build_tests=ON
          -Dgmock_build_tests=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS_DEBUG="${DEBUG_FLAGS}"
          -DCMAKE_CXX_FLAGS_DEBUG="${DEBUG_FLAGS}"
          -DCMAKE_EXE_LINKER_FLAGS_DEBUG=""
          -DCMAKE_SHARED_LINKER_FLAGS_DEBUG=""
          -DCMAKE_CXX_STANDARD=17
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=""
          -DCMAKE_JOB_POOLS="link=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu || echo 4)"
          -DCMAKE_JOB_POOL_LINK=link

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: >
          ctest --test-dir build
          --repeat until-pass:3

      - name: Stop reclient (RBE)
        if: ${{ always() && runner.os == 'Linux' }}
        run: bootstrap --shutdown
